[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chineseeeg-language-decoding"
version = "0.1.0"
description = "Leakage-resistant EEG-language contrastive retrieval research codebase."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "mne>=1.6",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
]

[project.optional-dependencies]
audio = [
  "librosa>=0.10",
  "soundfile>=0.12",
  "torchaudio>=2.1",
  "transformers>=4.40",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

